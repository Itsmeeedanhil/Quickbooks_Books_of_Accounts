[package]
name = "books-of-account-program"
version = "1.0.0"
description = "QuickBooks Desktop 3rd Party Books of Accounts for Philippine BIR Compliance with MS Access Local DB"
authors = ["You"]
edition = "2021"

[lib]
name = "books_of_account_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Foundation",
] }

